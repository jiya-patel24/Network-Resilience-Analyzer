<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Network Resilience Analyzer - Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <meta name="color-scheme" content="light">
</head>
<body>
  <p id="status" style="font-family: sans-serif; font-size: 13px; color: #b35c00;"></p>
  <svg width="800" height="600"></svg>

  <script>
    const FALLBACK_DATA = {
      nodes: [
        { id: "1", is_critical: false, severity: 0 },
        { id: "2", is_critical: false, severity: 0 },
        { id: "3", is_critical: true,  severity: 2 },
        { id: "4", is_critical: true,  severity: 1 },
        { id: "5", is_critical: false, severity: 0 }
      ],
      edges: [
        { source: "1", target: "2" },
        { source: "2", target: "3" },
        { source: "3", target: "1" },
        { source: "3", target: "4" },
        { source: "4", target: "5" }
      ]
    };

    function drawGraph(graph) {
      const svg = d3.select("svg");
      const width = +svg.attr("width");
      const height = +svg.attr("height");

      svg.append("rect")
        .attr("width", width)
        .attr("height", height)
        .attr("fill", "#ffffff");

      const legend = svg.append("g").attr("transform", "translate(20, 20)");
      const legendItems = [
        { label: "Critical node (articulation point)", color: "#e63946" },
        { label: "Normal node", color: "#457b9d" }
      ];

      legend.selectAll("circle")
        .data(legendItems)
        .join("circle")
        .attr("cx", 8)
        .attr("cy", (d, i) => i * 22)
        .attr("r", 8)
        .attr("fill", d => d.color);

      legend.selectAll(".legend-text")
        .data(legendItems)
        .join("text")
        .attr("class", "legend-text")
        .attr("x", 22)
        .attr("y", (d, i) => i * 22 + 4)
        .attr("font-size", 12)
        .attr("font-family", "sans-serif")
        .attr("fill", "#1d1d1d")
        .text(d => d.label);

      legend.append("text")
        .attr("x", 0)
        .attr("y", 55)
        .attr("font-size", 12)
        .attr("font-family", "sans-serif")
        .attr("fill", "#1d1d1d")
        .text("Circle size = severity (bigger = more damaging if removed)");

      const BASE_RADIUS = 8;
      const SEVERITY_SCALE = 4;
      const radiusFor = d => BASE_RADIUS + d.severity * SEVERITY_SCALE;
      const colorFor = d => d.is_critical ? "#e63946" : "#457b9d";

      const simulation = d3.forceSimulation(graph.nodes)
        .force("link", d3.forceLink(graph.edges).id(d => d.id).distance(80))
        .force("charge", d3.forceManyBody().strength(-200))
        .force("center", d3.forceCenter(width / 2, height / 2));

      const link = svg.append("g")
        .selectAll("line")
        .data(graph.edges)
        .join("line")
        .attr("stroke", "#999");

      const node = svg.append("g")
        .selectAll("circle")
        .data(graph.nodes)
        .join("circle")
        .attr("r", radiusFor)
        .attr("fill", colorFor)
        .attr("stroke", "#1d1d1d")
        .attr("stroke-width", 1);

      node.append("title")
        .text(d => `node ${d.id} (severity: ${d.severity})`);

      const label = svg.append("g")
        .selectAll("text")
        .data(graph.nodes)
        .join("text")
        .text(d => d.id)
        .attr("font-size", 10)
        .attr("font-family", "sans-serif")
        .attr("text-anchor", "middle")
        .attr("fill", "#1d1d1d")
        .attr("pointer-events", "none");

      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);
        node
          .attr("cx", d => d.x)
          .attr("cy", d => d.y);
        label
          .attr("x", d => d.x)
          .attr("y", d => d.y + radiusFor(d) + 12);
      });
    }

    d3.json("data.json")
      .then(drawGraph)
      .catch(err => {
        console.error("Could not load data.json:", err);
        document.getElementById("status").textContent =
          "Could not load data.json (usually because the page was opened by double-click). " +
          "Showing built-in sample data instead. Run: python -m http.server 8000";
        drawGraph(FALLBACK_DATA);
      });
  </script>
</body>
</html>
